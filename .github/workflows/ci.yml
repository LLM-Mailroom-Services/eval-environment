name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh && echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Bootstrap
        run: bash scripts/cloud-agent-install.sh
      - name: Hermetic tests
        run: uv run pytest tests/ -q
      - name: Comparison report index
        run: uv run python scripts/render_comparison_reports.py
      - name: Experiment log render
        run: uv run python scripts/render_experiment_log.py --validate
      - name: Viewer snapshot
        run: uv run python scripts/export_site_snapshot.py --check
