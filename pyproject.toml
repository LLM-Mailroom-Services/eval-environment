[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mailroom-evals"
version = "0.4.0"
description = "Evaluation tasks, pilot scenarios, and calibration suites for the llm-mailroom langgraph pipeline"
requires-python = ">=3.11"
dependencies = [
    # The pipeline under test (path-resolved below; brings langgraph, agents,
    # observability backends, and the HF corpus loader with it).
    "mailroom",
    # Scoring suite — git-pinned so the eval-env is fully portable/standalone.
    # v0.15.0 ships configure_from_taxonomy(): the harness wires the corpus
    # taxonomy once at process start (src/evals/dojo_wiring.py) so
    # field_scoring.get_field_types(doc_class) auto-resolves real field-type
    # maps instead of {} (degraded extraction scores pre-wiring).
    "llm-dojo-scoring @ git+https://github.com/Exios66/llm-dojo-scoring.git@v0.15.0",
    # Corpus loading (hf_corpus_loader is pandas-based; pyarrow for parquet).
    "pandas>=2.0",
    "pyarrow>=14.0",
    "structlog>=24.0",
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.uv.sources]
# Dev-machine resolution: the canonical pipeline lives in the Digital-Mailroom
# uv workspace. Override with a git source when this repo moves machines.
mailroom = { path = "../Digital-Mailroom/packages/llm-mailroom", editable = true }

# llm-dojo-scoring is intentionally NOT listed here: it resolves from the git
# pin in [project.dependencies] (@v0.15.0), never an editable path. The
# editable-path resolution visible in older uv.lock files was the transitive
# Digital-Mailroom workspace artifact; the git pin replaces it so this repo
# locks and runs standalone on any machine.

[tool.setuptools.packages.find]
where = ["src"]
include = ["evals*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "scripts", "."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# BLE001/S110: deliberate fail-soft degradation in tracing/observability paths
# ("a run never fails because its sink is down") — mirrors llm-mailroom style.
ignore = ["BLE001", "S110"]
